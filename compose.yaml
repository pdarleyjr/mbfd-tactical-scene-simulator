name: mbfd-tactical-scene-simulator

# Two containers: Caddy serves the built app and scenario media, and the sync
# service keeps the live shared scenes (WebSocket rooms, saved to disk with
# automatic snapshots). Live scenes are in the `live_scenes` volume, and the
# V2 PostgreSQL volume is intentionally left in place for rollback. Never run
# `docker compose down -v` on the production host: it deletes both.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_RELEASE: ${APP_RELEASE:-development}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8230}:8080"
    depends_on:
      - sync
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 4s
      retries: 6
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop: [ALL]
    # The Caddy binary carries the bind-port file capability; exec fails without it.
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

  sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "8090"
    volumes:
      - live_scenes:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/sync-api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 6
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  live_scenes:
