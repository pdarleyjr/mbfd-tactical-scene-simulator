name: mbfd-tactical-scene-simulator

# V3 is a static application: one Caddy container serves the built app and
# scenario media. Scene data lives in each browser (IndexedDB) and in exported
# scene files. The V2 PostgreSQL volume is intentionally left in place for
# rollback; never run `docker compose down -v` on the production host.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_RELEASE: ${APP_RELEASE:-development}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8230}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 4s
      retries: 6
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop: [ALL]
    # The Caddy binary carries the bind-port file capability; exec fails without it.
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
